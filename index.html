let userAnswers = {};
let totalAnswered = 0;
let timerInterval = null;
let timeLeft = 1200; // 20 Menit (dalam detik)

// Fisher-Yates Shuffle Algorithm
function shuffleArray(array) {
  let shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function startQuiz() {
    const name = document.getElementById('userName').value.trim();
    const id = document.getElementById('userId').value.trim();

    if (!name || !id) {
        alert("Harap lengkapi Nama dan Email/ID Peserta sebelum memulai!");
        return;
    }

    document.getElementById('welcomeCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    document.getElementById('actionContainer').style.display = 'block';

    renderQuiz();
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById('timerDisplay').innerText = 
            `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("Waktu ujian telah habis! Jawaban Anda akan dikirim secara otomatis.");
            submitQuiz();
        }
    }, 1000);
}

function renderQuiz() {
    const quizContainer = document.getElementById('quizContainer');
    quizContainer.innerHTML = '';

    // Acak urutan soal
    const shuffledQuestions = shuffleArray(kanjiData);
    document.getElementById('progressDisplay').innerText = `0 / ${shuffledQuestions.length}`;

    shuffledQuestions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        const highlightedText = q.context.replace(q.target, `<span class="kanji-highlight">${q.target}</span>`);

        // Map & Shuffle Pilihan
        let optionObjects = q.opts.map((optText, optIdx) => ({
            text: optText,
            isCorrect: optIdx === q.ans
        }));
        optionObjects = shuffleArray(optionObjects);

        card.innerHTML = `
            <div class="q-title">${index + 1}. ${highlightedText}</div>
            <div class="options" id="opts-${q.id}">
                ${optionObjects.map((opt, idx) => `
                    <button class="opt-btn" data-correct="${opt.isCorrect}" onclick="selectAnswer(this, ${q.id})">
                        ${String.fromCharCode(65 + idx)}.${opt.text}
                    </button>
                `).join('')}
            </div>
            <div class="detail-box" id="detail-${q.id}">
                <div class="detail-title">Detail Kanji: ${q.target}</div>
                <b>Arti:</b> ${q.arti}<br>
                <b>Onyomi:</b> ${q.onyomi || '-'}<br>
                <b>Kunyomi:</b> ${q.kunyomi || '-'}<br>
                <b>Contoh:</b> ${q.contoh_kalimat || '-'}<br>
                <b>Penjelasan:</b> ${q.exp}
            </div>
        `;
        quizContainer.appendChild(card);
    });
}

function selectAnswer(btn, qId) {
    const parentContainer = document.getElementById(`opts-${qId}`);
    const buttons = parentContainer.querySelectorAll('.opt-btn');

    // Kunci tombol agar tidak bisa diganti terus-menerus
    buttons.forEach(b => b.disabled = true);

    const isCorrect = btn.getAttribute('data-correct') === 'true';
    if (isCorrect) {
        btn.classList.add('correct');
        userAnswers[qId] = true;
    } else {
        btn.classList.add('wrong');
        userAnswers[qId] = false;
    }

    // Tampilkan penjelasan
    document.getElementById(`detail-${qId}`).style.display = 'block';

    // Update Progres
    totalAnswered++;
    document.getElementById('progressDisplay').innerText = `${totalAnswered} / ${kanjiData.length}`;
}

function submitQuiz() {
    clearInterval(timerInterval);

    // Hitung Skor (Skala 0 - 100)
    let correctCount = Object.values(userAnswers).filter(val => val === true).length;
    let score = Math.round((correctCount / kanjiData.length) * 100);
    let isPassed = score >= 70;

    const name = document.getElementById('userName').value.trim();
    const id = document.getElementById('userId').value.trim();

    // Sembunyikan Kuis, Tampilkan Layar Hasil
    document.getElementById('quizContainer').style.display = 'none';
    document.getElementById('actionContainer').style.display = 'none';
    document.getElementById('sticky-header').style.display = 'none';
    
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';

    document.getElementById('participantInfo').innerText = `Peserta: ${name} (${id})`;
    document.getElementById('finalScore').innerText = score;
    
    const passStatus = document.getElementById('passStatus');
    if (isPassed) {
        passStatus.innerText = "SELAMAT, ANDA LULUS! 🎉";
        passStatus.style.color = "#2e7d32";
    } else {
        passStatus.innerText = "MAAF, ANDA BELUM LULUS ❌";
        passStatus.style.color = "#c62828";
    }

    // Kirim Data ke Google Sheets
    sendDataToDashboard({
        nama: name,
        email: id,
        score: score,
        percentage: score,
        status: isPassed ? "LULUS" : "TIDAK LULUS"
    });
}

function sendDataToDashboard(payload) {
    if(!SCRIPT_URL || SCRIPT_URL.includes("YOUR_SCRIPT_ID_HERE")) {
        console.warn("URL Google Apps Script belum dikonfigurasi.");
        return;
    }

    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(() => console.log("Data ujian berhasil dikirim ke Google Sheets."))
    .catch(err => console.error("Gagal mengirim data:", err));
}
